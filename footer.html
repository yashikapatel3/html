<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="footer">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Fragment</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            href="https://fonts.googleapis.com/css2?family=Cookie&family=Monoton&family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet">
    <style>
        .footer {
            font-family: Poppins, sans-serif;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(44, 31, 46, 0.95) 100%) !important;
            border-top: 3px solid #F5A623;
            box-shadow: 0 -2px 10px rgba(245, 166, 35, 0.3);
            padding: 2rem 0;
            margin-top: auto;
            position: relative;
            overflow: hidden;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.3) 50%,
                    transparent 100%);
        }

        /* Main Footer Container */
        .footer-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Left Side - Logo */
        .footer-left {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .footer .xits-img {
            width: 150px;
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.1));
            transition: transform 0.3s ease;
        }

        .footer .xits-img:hover {
            transform: scale(1.05);
        }

        /* Right Side - Content */
        .footer-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            justify-content: flex-end;
            text-align: end;
        }

        .footer p {
            color: #64748B;
            font-size: 0.95rem;
            font-family: 'Inter', 'Poppins', sans-serif;
            margin: 0;
            line-height: 1.6;
        }

        .footer-links {
            display: flex;
            align-items: end;
            text-align: end;
            justify-content: flex-end;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #94A3B8;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            position: relative;
            font-family: 'Poppins', sans-serif;
            white-space: nowrap;
            text-align: end;
        }

        .footer-links a:hover {
            color: #F5A623;
            transform: translateY(-2px);
        }

        .footer-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #F5A623;
            transition: width 0.3s ease;
        }

        .footer-links a:hover::after {
            width: 100%;
        }

        .copyright {
            color: #64748B;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .footer {
                padding: 1.75rem 0;
            }

            .footer-container {
                gap: 2rem;
            }

            .footer .xits-img {
                width: 85px;
                height: 70px;
            }

            .footer p {
                font-size: 0.9rem;
            }

            .footer-links {
                gap: 1.5rem;
            }

            .footer-links a {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 768px) {
            .footer {
                padding: 1.5rem 0;
            }

            .footer-container {
                flex-direction: column;
                gap: 1.5rem;
                text-align: center;
            }

            .footer-left {
                justify-content: center;
            }

            .footer .xits-img {
                width: 75px;
                height: 62px;
            }

            .footer-right {
                align-items: center;
            }

            .footer-links {
                justify-content: center;
                gap: 1.5rem;
            }

            .footer p {
                font-size: 0.88rem;
            }
        }

        @media (max-width: 576px) {
            .footer {
                padding: 1.25rem 0;
            }

            .footer-container {
                gap: 1rem;
            }

            .footer .xits-img {
                width: 65px;
                height: 54px;
            }

            .footer-links {
                gap: 1rem;
            }

            .footer-links a {
                font-size: 0.8rem;
            }

            .footer p {
                font-size: 0.82rem;
            }

            .copyright {
                font-size: 0.78rem;
            }
        }

        @media (max-width: 400px) {
            .footer .xits-img {
                width: 55px;
                height: 46px;
            }

            .footer-links {
                gap: 0.75rem;
            }

            .footer-links a {
                font-size: 0.75rem;
            }

            .footer p {
                font-size: 0.78rem;
            }
        }
    </style>
</head>

<body>
<footer class="footer">
    <div class="container-fluid px-3 px-md-4">
        <div class="footer-container">
            <!-- Left Side - Logo -->
            <div class="footer-left">
                <img th:src="@{/images/XITS.png}" class="xits-img" alt="xits">
            </div>

            <!-- Right Side - Content -->
            <div class="footer-right">
                <p>Your ultimate destination for movie ratings and reviews</p>

                <div class="footer-links">
                    <a href="#" th:href="@{/about}">About</a>
                    <a href="#" th:href="@{/privacy}">Privacy</a>
                    <a href="#" th:href="@{/terms}">Terms</a>
                    <a href="#" th:href="@{/contact}">Contact</a>
                </div>

                <p class="copyright">© 2025 Kaisi Lagi. All rights reserved.</p>
            </div>
        </div>
    </div>
</footer>

<!-- Bootstrap JS (Optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
